<!doctype html><meta charset="utf-8" />
<script>
  (function () {
    const u = new URL(location.href);
    const msg = {
      __al_silent__: true,
      code: u.searchParams.get('code'),
      state: u.searchParams.get('state'),
      error: u.searchParams.get('error'),
    };
    parent.postMessage(msg, location.origin);
  })();
</script>
