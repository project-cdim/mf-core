# For staging
# docker compose -f compose.yaml -f compose.staging.yaml up -d --build
# Instead of run dev, execute build -> start

services:
  mf-core:
    command: >
      sh -c "
      npm run build &&
      npm run start
      "
  mf-resource:
    command: >
      sh -c "
      npm run build &&
      npm run start
      "
  mf-layout:
    command: >
      sh -c "
      npm run build &&
      npm run start
      "
  mf-user:
    command: >
      sh -c "
      npm run build &&
      npm run start
      "
